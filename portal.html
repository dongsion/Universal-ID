<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal ID - Portal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
  padding: 20px;
}
.portal-container {
  text-align: center;
  max-width: 480px;
  width: 100%;
}
.portal-logo {
  font-size: 36px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.portal-logo span { color: #FFD60A; }
.portal-sub {
  font-size: 15px;
  color: #666;
  margin-bottom: 48px;
}
.portal-cards {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.portal-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px 24px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
}
.portal-card:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-2px);
}
.portal-card:active { transform: scale(0.98); }
.portal-card-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.portal-card-icon.customer { background: #FFD60A; }
.portal-card-icon.merchant { background: #7c3aed; }
.portal-card-text { text-align: left; flex: 1; }
.portal-card-title {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.portal-card-desc {
  font-size: 13px;
  color: #888;
}
.portal-card-arrow {
  color: #444;
  font-size: 20px;
}
.portal-footer {
  margin-top: 40px;
  font-size: 12px;
  color: #444;
}
</style>
</head>
<body>
<div class="portal-container">
  <div class="portal-logo">Universal<span>ID</span></div>
  <p class="portal-sub">Snacks E-commerce Platform</p>
  <div class="portal-cards">
    <a class="portal-card" href="index.html">
      <div class="portal-card-icon customer">🛍️</div>
      <div class="portal-card-text">
        <div class="portal-card-title">Customer App</div>
        <div class="portal-card-desc">Browse snacks, add to cart, checkout</div>
      </div>
      <div class="portal-card-arrow">→</div>
    </a>
    <a class="portal-card" href="merchant.html">
      <div class="portal-card-icon merchant">📊</div>
      <div class="portal-card-text">
        <div class="portal-card-title">Merchant Dashboard</div>
        <div class="portal-card-desc">Manage products, view orders, track sales</div>
      </div>
      <div class="portal-card-arrow">→</div>
    </a>
  </div>
  <p class="portal-footer">Data syncs locally between both apps</p>
</div>
</body>
</html>
